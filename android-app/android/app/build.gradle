apply plugin: 'com.android.application'

android {
    namespace "com.mathenachhilfeonline.rechenblitz"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mathenachhilfeonline.rechenblitz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31700
        versionName "3.17.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Hüllen-Nummer (android-app/SHELL) und Kanal: test = Branch rechenblitz-test, live = rechenblitz-live (RB_CHANNEL=live für Store)
        buildConfigField "int", "RB_SHELL", file('../../SHELL').text.trim()
        buildConfigField "String", "RB_CHANNEL", "\"${System.getenv('RB_CHANNEL') ?: 'test'}\""
        // Vertrieb: github = Test-APK (darf sich per APK-Download aktualisieren), play = Google Play (APK nur über Play)
        buildConfigField "String", "RB_STORE", "\"${System.getenv('RB_STORE') ?: 'github'}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Fester Test-Schlüssel, damit jede Test-APK sich als Update installiert (Lernstand bleibt).
    // RB_KEYSTORE = Pfad zur Datei (GitHub-Ablauf); sonst der Debug-Schlüssel im Benutzerordner.
    signingConfigs {
        // Upload-Schlüssel für Google Play: nur über Umgebungsvariablen (GitHub-Geheimnisse), nie im Repo
        if (System.getenv('RB_UPLOAD_KEYSTORE')) {
            upload {
                storeFile file(System.getenv('RB_UPLOAD_KEYSTORE'))
                storePassword System.getenv('RB_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('RB_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('RB_UPLOAD_KEY_PASSWORD') ?: System.getenv('RB_UPLOAD_STORE_PASSWORD')
            }
        }
        rbtest {
            storeFile file(System.getenv('RB_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        // Beide Fassungen verkleinert (R8): ungenutzter Code und Ressourcen fliegen raus → kleine APK
        debug {
            signingConfig signingConfigs.rbtest
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (System.getenv('RB_UPLOAD_KEYSTORE')) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Play-Fassung: neue App-Hüllen über die In-App-Updates von Google Play (wird in der GitHub-Fassung nicht aufgerufen)
    implementation 'com.google.android.play:app-update:2.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
