<style>
html{background:#101b43}body{margin:0}
#boot{position:fixed;inset:0;z-index:9999;background:#101b43;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font:700 26px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .35s ease}
#boot.out{opacity:0;pointer-events:none}
#boot svg{width:76px;height:76px;animation:bootbz 1.1s ease-in-out infinite}
#boot small{font:500 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;opacity:.7;margin-top:-10px}
#boot .bar{width:168px;height:6px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
#boot .bar i{display:block;height:100%;width:6%;background:#ff7418;border-radius:9px;transition:width .25s ease;animation:bootfill 2.6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bootfill{to{width:80%}}
@keyframes bootbz{50%{transform:scale(1.08) rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){#boot svg{animation:none}#boot{transition:none}}
</style>
<script>
(function () {
  var n = 0, T = 2, done = false;
  window.__bp = function () { n++; var b = document.getElementById('bootBar'); if (b && n >= T) { b.style.animation = 'none'; b.style.width = '90%'; } };
  window.__bootDone = function () {
    if (done) return; done = true;
    var b = document.getElementById('boot'), bar = document.getElementById('bootBar');
    if (bar) { bar.style.animation = 'none'; bar.style.width = '100%'; }
    document.documentElement.style.background = '';
    if (b) { b.classList.add('out'); setTimeout(function () { b.remove(); }, 380); }
  };
  window.__cssReady = new Promise(function (res) { window.__cssLoaded = res; setTimeout(res, 8000); });
  setTimeout(window.__bootDone, 12000);   // Sicherheitsnetz: Startbild nie dauerhaft
  // Übersetzung für Englisch/Ukrainisch sofort parallel vorladen (gleiche Erkennung wie js/i18n.js)
  try {
    var pref = (JSON.parse(localStorage.getItem('rechenblitz') || '{}') || {}).lang || 'auto', lang = 'de';
    if (pref === 'en' || pref === 'uk' || pref === 'de') lang = pref;
    else { var ls = navigator.languages || [navigator.language || 'de']; for (var i = 0; i < ls.length; i++) { var c = String(ls[i]).slice(0, 2).toLowerCase(); if (c === 'de' || c === 'en' || c === 'uk') { lang = c; break; } } }
    window.__bootLang = lang;
    if (lang !== 'de') { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = 'js/lang-' + lang + '.js'; document.head.appendChild(l); }
  } catch (e) {}
})();
</script>
