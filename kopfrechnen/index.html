<!doctype html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b43">
<meta name="description" content="Rechenblitz von Nachhilfe – online: Kopfrechnen üben mit zufälligen Aufgaben – Einmaleins, Brüche, Dezimalzahlen, Prozent, Gleichungen, Textaufgaben und mehr.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechenblitz">
<title>Rechenblitz – Kopfrechnen üben</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

<!-- ===== Startseite ===== -->
<section class="screen" id="home">
  <header class="brand">
    <a class="brandlink" id="brandLink" target="_blank" rel="noopener" title="Zur Website mathenachhilfe-online.com"><img src="icons/logo.svg" alt="" width="40" height="40"><div><b>Rechenblitz</b><small>by Nachhilfe – online</small></div></a>
    <div class="spacer"></div>
    <button class="chip" id="btnProfile" aria-label="Profil wechseln"></button>
    <button class="round" id="btnSound" aria-label="Ton an/aus"></button>
    <button class="round" id="btnTheme" aria-label="Hell/Dunkel umschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <div class="topbar"><a class="backlink" id="btnLernraum" hidden>← Lernraum</a><span class="muted" id="topbarText">Persönliche Online-Nachhilfe 1:1</span><a class="sitebtn" id="btnSite" target="_blank" rel="noopener">Zur Website ↗</a></div>

  <div class="home-grid">
  <div class="col-left">
  <button class="card statusbar" data-open="badges" aria-label="Mein Fortschritt">
    <span class="lvbadge" id="pLevel">1</span>
    <span class="sb-main"><b id="pRank">Rechen-Starter</b><span class="bar"><i id="pXpBar"></i></span></span>
    <span class="sb-stat" title="Tage in Folge">🔥 <b id="sDays">0</b></span>
    <span class="sb-stat" title="Tagesziel">🎯 <b id="sToday">0/50</b></span>
  </button>
  <div class="card assign" id="assignCard" hidden></div>
  <div class="card challenge advent-card" id="adventCard" hidden></div>
  <div class="card challenge" id="challengeCard"></div>
  <div class="card challenge" id="classCard" hidden></div>
  <div class="card promo desk-only" id="promo"></div>
  </div>
  <div class="col-right">
  <h2 class="ask">Was willst du üben?</h2>
  <div id="classNote"></div>
  <div class="topics" id="topics"></div>
  <div class="levelline"><span id="lvlLine"></span> <button class="linkbtn" id="lvlToggle">ändern</button></div>
  <div class="levelbox" id="levelBox" hidden><div class="levels" id="levels"></div><div class="lvldesc" id="lvlDesc"></div></div>
  <button class="btn primary startbtn" id="btnStart">▶ Los geht’s</button>
  <div class="bestline muted small" id="bestLine"></div>
  <div class="modechips" id="modes">
    <button data-mode="blitz">⚡ Blitzrunde</button>
    <button data-mode="zen">🍃 Ruhig üben</button>
    <button data-mode="duel">⚔️ Duell</button>
    <button data-mode="fehler" id="btnFehler">📦 Fehlerkiste</button>
    <button data-mode="test">🧪 Einstufungstest</button>
  </div>
  <div class="card promo mobile-only" id="promo2"></div>
  </div>
  </div>
  <div class="foot"><a id="lnkSite" target="_blank" rel="noopener">mathenachhilfe-online.com</a><a id="lnkImp" target="_blank" rel="noopener">Impressum</a><a id="lnkPriv" target="_blank" rel="noopener">Datenschutz</a><span id="verText"></span></div>
</section>

<!-- ===== Spiel ===== -->
<section class="screen" id="game" hidden>
  <div class="gtop">
    <button class="round" id="btnQuit" aria-label="Beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="bar"><i id="gBarFill"></i></div>
    <div class="pill" id="gInfo">0/20</div>
    <button class="round" id="btnSoundG" aria-label="Ton an/aus"></button>
    <button class="round" id="btnThemeG" aria-label="Hell/Dunkel umschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <div class="hud"><span class="streak" id="gStreak">🔥 0</span><span id="gScore">0 Punkte</span></div>
  <div class="win">
    <div class="win-bar"><i></i><i></i><i></i><span id="winTitle">Aufgabe</span><span class="tag" id="winTag">Stufe 1</span></div>
    <div class="paper" id="taskBox">
      <div class="expr" id="expr"></div>
      <div class="hint" id="hint"></div>
      <div class="ansrow"><span class="pre" id="pre"></span><div class="answer" id="answer"></div><span class="unit" id="unit"></span></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="solution" id="solution" hidden></div>
  </div>
  <div class="pad" id="pad"></div>
</section>

<!-- ===== Ergebnis ===== -->
<section class="screen result" id="result" hidden></section>

<!-- ===== Duell ===== -->
<section id="duel" hidden></section>
</div>

<button class="fab" id="fab" aria-label="Menü: Hilfe, Fehler melden, Einstellungen" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.4"/><path d="M12 16.6h.01"/></svg>
</button>
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="round" id="sheetBack" aria-label="Zurück" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h3 id="sheetTitle">Menü</h3>
      <button class="round" id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<canvas id="confetti"></canvas>
<div id="print"></div>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lang-en.js"></script>
<script src="js/lang-uk.js"></script>
<script src="js/changelog.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script src="js/panels.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/extras.js"></script>
<script>init(); i18nStart();</script>
</body>
</html>
